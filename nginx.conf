# ==============================================================
#  RobinAI — Nginx Reverse Proxy Configuration
#  For VPS deployment (Ubuntu/Debian) with Let's Encrypt SSL
#
#  Place this file at:
#    /etc/nginx/sites-available/robinai
#
#  Then enable it:
#    sudo ln -s /etc/nginx/sites-available/robinai /etc/nginx/sites-enabled/
#    sudo nginx -t
#    sudo systemctl reload nginx
# ==============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name robinai.digital www.robinai.digital;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name robinai.digital www.robinai.digital;

    # ── SSL Certificates (managed by Certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/robinai.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robinai.digital/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip Compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Client Upload Limit ─────────────────────────────────────
    client_max_body_size 5M;

    # ── Proxy to Node.js ────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts for AI responses (Gemini can take up to 30s)
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── Static Asset Caching ────────────────────────────────────
    # These are served by Node.js/Express, but Nginx caches them
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Host $host;
        expires            1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Logging ─────────────────────────────────────────────────
    access_log /var/log/nginx/robinai-access.log;
    error_log  /var/log/nginx/robinai-error.log;
}
